<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="t d">
  <title id="t">Cachain architecture</title>
  <desc id="d">Members, the operator, the Squads council and the attestation issuer act on the Cachain program, which controls two Token-2022 mints, two USDC vaults and reads Solana Attestation Service accounts.</desc>
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945FF"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA0FF"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14F195"/>
    </marker>
    <style>
      .t { font: 800 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fff; }
      .h { font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fff; }
      .b { font: 400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #C9CEE6; }
      .m { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8FA0FF; }
      .mg { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #14F195; }
      .actor { fill: #161E45; stroke: #2B3570; }
      .ext { fill: #11182F; stroke: #3A4580; stroke-dasharray: 5 4; }
      .sub { fill: #1C2654; stroke: #34408A; }
    </style>
  </defs>
  <rect width="1280" height="660" rx="24" fill="#0B1026"/>
  <text x="40" y="52" class="t">Architecture</text>
  <text x="40" y="80" class="b" style="font-size:15px">one Anchor program · Token-2022 · Solana Attestation Service · Squads v4 · Kit client generated by Codama</text>

  <!-- actors -->
  <g transform="translate(40 96)"><rect class="actor" width="270" height="104" rx="14"/>
    <text x="18" y="32" class="h">Members</text>
    <text class="b"><tspan x="18" y="56">whitelisted wallets: propose, fund,</tspan><tspan x="18" y="76">claim and deliver work, transfer,</tspan><tspan x="18" y="96">claim their share of rent</tspan></text></g>
  <g transform="translate(40 216)"><rect class="actor" width="270" height="104" rx="14"/>
    <text x="18" y="32" class="h">Operator</text>
    <text class="b"><tspan x="18" y="56">the company that runs the asset</tspan><tspan x="18" y="76">pays rent in, which raises every</tspan><tspan x="18" y="96">profit holder's claim</tspan></text></g>
  <g transform="translate(40 336)"><rect class="actor" width="270" height="104" rx="14" stroke="#FFB86B"/>
    <text x="18" y="32" class="h">Council · Squads 2-of-3</text>
    <text class="b"><tspan x="18" y="56">its vault PDA is the only key that</tspan><tspan x="18" y="76">curates, accepts, pauses, closes</tspan><tspan x="18" y="96">and moves capital to the SPE</tspan></text></g>
  <g transform="translate(40 456)"><rect class="actor" width="270" height="104" rx="14"/>
    <text x="18" y="32" class="h">Issuer</text>
    <text class="b"><tspan x="18" y="56">attests members after off-chain</tspan><tspan x="18" y="76">KYC; stores a hash, never the</tspan><tspan x="18" y="96">record; revokes by closing</tspan></text></g>

  <!-- program -->
  <rect x="380" y="96" width="520" height="464" rx="18" fill="#121A3D" stroke="url(#sol)" stroke-width="2.5"/>
  <text x="404" y="130" class="h" style="font-size:19px">Cachain program</text>
  <text x="572" y="130" class="m">CachxfgQ…QP6S · Anchor 1.2.1</text>
  <g transform="translate(400 146)"><rect class="sub" width="480" height="70" rx="10"/>
    <text x="16" y="26" class="h" style="font-size:15px">Asset</text>
    <text x="16" y="50" class="b">policy numbers from config · USDC ledger · reward index · status</text></g>
  <g transform="translate(400 226)"><rect class="sub" width="480" height="70" rx="10"/>
    <text x="16" y="26" class="h" style="font-size:15px">Bounties</text>
    <text x="16" y="50" class="b">one PDA each · explicit state machine · terms fixed at curation</text></g>
  <g transform="translate(400 306)"><rect class="sub" width="480" height="70" rx="10"/>
    <text x="16" y="26" class="h" style="font-size:15px">Eligibility gate</text>
    <text x="16" y="50" class="b">thaw_holder / freeze_holder · reads the holder's SAS attestation</text></g>
  <g transform="translate(400 386)"><rect class="sub" width="480" height="70" rx="10"/>
    <text x="16" y="26" class="h" style="font-size:15px">Issuance</text>
    <text x="16" y="50" class="b">member tokens and the holding's share in one instruction</text></g>
  <g transform="translate(400 466)"><rect class="sub" width="480" height="70" rx="10"/>
    <text x="16" y="26" class="h" style="font-size:15px">Distribution</text>
    <text x="16" y="50" class="b">positions · pull claims · transfer hook keeps balances exact</text></g>

  <!-- right column -->
  <g transform="translate(980 96)"><rect class="ext" width="260" height="164" rx="14"/>
    <text x="18" y="32" class="h">Token-2022</text>
    <text class="b"><tspan x="18" y="58">ownership mint · profit mint</tspan><tspan x="18" y="80">DefaultAccountState = Frozen</tspan><tspan x="18" y="102">TransferHook · TokenMetadata</tspan><tspan x="18" y="124">mint and freeze authority:</tspan><tspan x="18" y="146">the asset PDA</tspan></text></g>
  <g transform="translate(980 276)"><rect class="ext" width="260" height="164" rx="14"/>
    <text x="18" y="32" class="h">USDC vaults</text>
    <text class="b"><tspan x="18" y="58">capital vault → SPE treasury</tspan><tspan x="18" y="80">(pinned at creation)</tspan><tspan x="18" y="108">income vault → profit holders</tspan><tspan x="18" y="130">a stray transfer changes no</tspan><tspan x="18" y="152">accounting</tspan></text></g>
  <g transform="translate(980 456)"><rect class="ext" width="260" height="164" rx="14"/>
    <text x="18" y="32" class="h">Attestation Service</text>
    <text class="b"><tspan x="18" y="58">credential · member schema</tspan><tspan x="18" y="80">one attestation per wallet at</tspan><tspan x="18" y="102">PDA(credential, schema, wallet)</tspan><tspan x="18" y="124">claim hash + tier + expiry</tspan></text></g>

  <!-- actor arrows -->
  <g stroke="#8FA0FF" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="312" y1="148" x2="376" y2="180"/>
    <line x1="312" y1="268" x2="376" y2="250"/>
    <line x1="312" y1="388" x2="376" y2="300"/>
    <path d="M312 520 L346 520 L346 600 L960 600 L960 560 L976 560"/>
  </g>
  <text x="560" y="592" class="m" text-anchor="middle">issuer creates / closes attestations</text>

  <!-- program to externals -->
  <g stroke="#14F195" stroke-width="2" fill="none">
    <line x1="902" y1="160" x2="976" y2="160" marker-end="url(#g)"/>
    <line x1="976" y1="210" x2="902" y2="210" marker-end="url(#g)"/>
    <line x1="902" y1="340" x2="976" y2="340" marker-end="url(#g)"/>
    <line x1="976" y1="380" x2="902" y2="380" marker-end="url(#g)"/>
    <line x1="976" y1="520" x2="902" y2="520" marker-end="url(#g)" stroke-dasharray="4 4"/>
  </g>
  <text x="939" y="152" class="mg" text-anchor="middle">mint</text>
  <text x="939" y="228" class="mg" text-anchor="middle">hook</text>
  <text x="939" y="332" class="mg" text-anchor="middle">pay</text>
  <text x="939" y="398" class="mg" text-anchor="middle">in</text>
  <text x="939" y="512" class="mg" text-anchor="middle">read</text>
</svg>
