<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
  <title id="t">Bounty state machine</title>
  <desc id="d">Proposed, Curated, Open. Work bounties go Claimed, Delivered, then Accepted and Settled, or Rejected. Financial bounties can be Paused and resumed, and close into Settled. Bounties without capital can be Cancelled.</desc>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFB86B"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B98CFF"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14F195"/></marker>
    <style>
      .t { font: 800 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fff; }
      .s { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #9AA3C7; }
      .n { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fff; }
      .e { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .node { fill: #1C2654; stroke: #3A4580; stroke-width: 1.5; }
      .end { fill: #1C2654; stroke: #8FA0FF; stroke-width: 3; }
      .lane { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #6E78A8; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1280" height="500" rx="24" fill="#0B1026"/>
  <text x="40" y="52" class="t">One account, one enum, one instruction per transition</text>
  <text x="40" y="80" class="s">An illegal transition reverts with InvalidBountyState. Terms are written once, at curation, and never again.</text>

  <text x="575" y="120" class="lane">WORK BOUNTY</text>
  <text x="575" y="440" class="lane">FINANCIAL BOUNTY (A TRANCHE)</text>

  <!-- nodes -->
  <g class="n" text-anchor="middle">
    <rect class="node" x="30" y="215" width="140" height="52" rx="26"/><text x="100" y="247">Proposed</text>
    <rect class="node" x="205" y="215" width="140" height="52" rx="26"/><text x="275" y="247">Curated</text>
    <rect class="node" x="380" y="215" width="140" height="52" rx="26" stroke="#14F195"/><text x="450" y="247">Open</text>
    <rect class="node" x="575" y="135" width="140" height="52" rx="26"/><text x="645" y="167">Claimed</text>
    <rect class="node" x="750" y="135" width="140" height="52" rx="26"/><text x="820" y="167">Delivered</text>
    <rect class="node" x="925" y="135" width="140" height="52" rx="26"/><text x="995" y="167">Accepted</text>
    <rect class="end" x="1100" y="245" width="140" height="52" rx="26"/><text x="1170" y="277">Settled</text>
    <rect class="end" x="750" y="245" width="140" height="52" rx="26"/><text x="820" y="277">Rejected</text>
    <rect class="node" x="575" y="365" width="140" height="52" rx="26"/><text x="645" y="397">Paused</text>
    <rect class="end" x="205" y="365" width="140" height="52" rx="26"/><text x="275" y="397">Cancelled</text>
  </g>

  <!-- council edges -->
  <g stroke="#FFB86B" stroke-width="2.2" fill="none" marker-end="url(#c)">
    <line x1="172" y1="241" x2="201" y2="241"/>
    <line x1="347" y1="241" x2="376" y2="241"/>
    <line x1="892" y1="161" x2="921" y2="161"/>
    <line x1="820" y1="189" x2="820" y2="241"/>
    <path d="M500 269 C 520 330, 540 360, 571 382"/>
    <path d="M573 400 C 520 400, 470 330, 470 271"/>
    <path d="M717 391 L1170 391 L1170 301"/>
    <path d="M100 269 C 100 340, 160 391, 201 391"/>
    <line x1="275" y1="269" x2="275" y2="361"/>
    <path d="M410 269 C 400 330, 380 391, 349 391"/>
  </g>
  <!-- member edges -->
  <g stroke="#B98CFF" stroke-width="2.2" fill="none" marker-end="url(#m)">
    <path d="M500 213 C 520 170, 540 161, 571 161"/>
    <line x1="717" y1="161" x2="746" y2="161"/>
  </g>
  <!-- permissionless -->
  <g stroke="#14F195" stroke-width="2.2" fill="none" marker-end="url(#g)">
    <path d="M1067 161 C 1150 161, 1170 200, 1170 241"/>
  </g>

  <!-- edge labels -->
  <g class="e">
    <text x="186" y="230" fill="#FFB86B" text-anchor="middle">curate</text>
    <text x="361" y="230" fill="#FFB86B" text-anchor="middle">open</text>
    <text x="522" y="176" fill="#B98CFF">claim</text>
    <text x="731" y="128" fill="#B98CFF" text-anchor="middle">submit</text>
    <text x="906" y="128" fill="#FFB86B" text-anchor="middle">accept</text>
    <text x="830" y="222" fill="#FFB86B">reject</text>
    <text x="1112" y="180" fill="#14F195">settle_work</text>
    <text x="540" y="318" fill="#FFB86B">pause</text>
    <text x="470" y="356" fill="#FFB86B" text-anchor="end">resume</text>
    <text x="940" y="383" fill="#FFB86B" text-anchor="middle">close_funding (from Open or Paused)</text>
    <text x="40" y="330" fill="#FFB86B">cancel</text>
    <text x="40" y="346" fill="#6E78A8">no capital raised;</text>
    <text x="40" y="362" fill="#6E78A8">also frees a Claimed</text>
    <text x="40" y="378" fill="#6E78A8">work bounty</text>
  </g>

  <!-- legend -->
  <g class="e" transform="translate(40 480)">
    <line x1="0" y1="-4" x2="28" y2="-4" stroke="#FFB86B" stroke-width="3"/><text x="36" y="0" fill="#C9CEE6">council: 2-of-3 Squads vault</text>
    <line x1="290" y1="-4" x2="318" y2="-4" stroke="#B98CFF" stroke-width="3"/><text x="326" y="0" fill="#C9CEE6">eligible member</text>
    <line x1="490" y1="-4" x2="518" y2="-4" stroke="#14F195" stroke-width="3"/><text x="526" y="0" fill="#C9CEE6">anyone (amount and recipient already fixed)</text>
  </g>
</svg>
