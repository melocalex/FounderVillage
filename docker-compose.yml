# docker compose run --rm gate     every check CI runs, in the pinned toolchain
# docker compose up dev            the localnet and harness on http://localhost:5183
name: cachain

x-image: &image
  build: .
  image: cachain-dev:local
  platform: linux/amd64
  environment:
    MAINNET_RPC_URL: ${MAINNET_RPC_URL:-}

services:
  gate:
    <<: *image
    command: ["bash", "scripts/gate.sh"]

  dev:
    <<: *image
    environment:
      CACHAIN_HOST: 0.0.0.0
      MAINNET_RPC_URL: ${MAINNET_RPC_URL:-}
    ports:
      - "5183:5183"
    command: ["npm", "run", "dev"]
