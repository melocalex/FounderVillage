[package]
name = "cachain"
version = "0.1.0"
description = "Founder Village asset tokenization: eligibility gate, bounties, contributions and pull distributions on Token-2022"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "cachain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "token", "token_2022", "token_2022_extensions", "associated_token"] }
spl-discriminator = "0.5"
spl-tlv-account-resolution = "0.11"
spl-transfer-hook-interface = "2.1"

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
